name: Recovered Sfery candidate
on:
  push:
    branches: [codex/prepare-recovered-update, codex/telegram-beta-1.45.1]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with the new Sfery v2 updater key after candidate testing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: recovered-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup override set 1.99.1
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            desktop/src-tauri/target
            ~/.cargo/registry
          key: ${{ runner.os }}-sfery-rust-1.99.1-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sfery-rust-1.99.1-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-sfery-rust-1.99.1-
      - name: Test Telegram storage queries
        run: node --test ../tools/tests/test-telegram-storage.cjs ../tools/tests/test-telegram-chats.cjs
      - name: Test and build compatible installer
        run: ./build-update.ps1
      - name: Verify installed upgrade from v1.45.0 on synthetic data
        run: ./scripts/test-installed-upgrade.ps1 -FromVersion 1.45.0
      - name: Build standalone recovered app for local preview
        run: |
          cargo build --locked --release --bin sfery-recovered --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Recovered preview build failed' }
          Copy-Item -LiteralPath src-tauri/target/release/sfery-recovered.exe -Destination dist/Sfery-Recovered.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sfery-recovered-preview
          path: desktop/dist/Sfery-Recovered.exe
          if-no-files-found: error
          retention-days: 14
      - name: Sign and verify with current updater key
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./sign-update.ps1 -Installer ./dist/update-1.45.3/Sfery_1.45.3_x64-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sfery-1.45.3-candidate
          path: desktop/dist/update-1.45.3/
          if-no-files-found: warn
          retention-days: 14
      - name: Save Rust build cache
        if: always() && !cancelled()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            desktop/src-tauri/target
            ~/.cargo/registry
          key: ${{ runner.os }}-sfery-rust-1.99.1-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
