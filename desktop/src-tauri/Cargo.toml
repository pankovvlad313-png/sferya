[package]
name = "sfery-recovered"
version = "1.45.2"
edition = "2024"
description = "Sfery reconstructed from the owner's shipped executable"
publish = false
default-run = "sfery-recovered"

[[bin]]
name = "sfery-upgrade-probe"
path = "src/upgrade_probe.rs"
required-features = ["upgrade-probe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = { version = "0.10", default-features = false }

[dependencies]
tauri = { version = "=2.12.0", features = ["protocol-asset", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.38.0", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
grammers-client = "=0.10.0"
grammers-session = { version = "=0.10.0", default-features = false, features = ["serde"] }
grammers-mtsender = "=0.10.0"
glass_pumpkin = "=2.0.0-rc0"

[features]
default = ["devtools"]
devtools = ["tauri/devtools"]
production-upgrade = []
upgrade-probe = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = "s"
strip = "debuginfo"
lto = false
codegen-units = 8

